<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%231f2d24%22/><path d=%22M12 78 L38 40 L52 58 L64 44 L88 78 Z%22 fill=%22%23f5f0e6%22/><circle cx=%2272%22 cy=%2228%22 r=%229%22 fill=%22%23c8613a%22/></svg>" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
		<script>
			// Runs before first paint so the stored theme never flashes.
			document.documentElement.dataset.theme =
				localStorage.getItem("theme") ??
				(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
