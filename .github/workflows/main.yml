name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# CMS saves land as separate commits; queue deploys instead of building in parallel on the server.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: 22
        command_timeout: 30m
        script: |
          set -e
          cd ~/letsmoe.com
          git fetch origin main
          git reset --hard origin/main
          # Without -x, ignored files survive: static/journey/ is gitignored and only lives on the server.
          git clean -f -d
          PATH="/root/.bun/bin:${PATH}"
          make prod
