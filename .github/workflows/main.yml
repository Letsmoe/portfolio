name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Project pages show the latest GitHub release as of the build, so rebuild once a day.
  schedule:
    - cron: "0 4 * * *"

# CMS saves land as separate commits; queue deploys instead of uploading in parallel.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delay-updates and --delete-delay swap the new files in at the end, so visitors never see half a deploy.
          rsync --archive --compress --delete --delete-delay --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            build/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/letsmoe.com/"
